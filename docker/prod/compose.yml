# ============================================================================
# ROBOYAM 운영 — 앱 서버 한 대분 (운영은 이 구성을 앱 서버 2대에 각각 올린다)
# ============================================================================
#
# 운영 구성: ALB(HTTPS, ACM 인증서) → 앱 서버 2대(EC2) → DB 서버 1대(EC2, PostgreSQL 직접 운영 — compose.db.yml)
#   - RDS 는 쓰지 않는다(사용자 결정 2026-11-04 — DB 배치를 pg_cron 으로 두는 설계라). DB 는 이 compose 에 넣지 않고 DB 서버에 따로 올린다
#   - HTTPS 는 ALB 가 받는다. 앱은 8080 으로 HTTP 만 받는다 (Caddy 없음)
#   - ALB 대상 그룹의 헬스체크 경로: /actuator/health/readiness
#   - /actuator/* 는 로드밸런서 헬스체크용으로만 연다 — 인터넷 쪽(ALB 리스너 규칙·보안 그룹)에서는 /actuator/* 를 막는다
#
# DB 서버(compose.db.yml)는 dev 와 같은 pg_cron 이미지·설정(cron.timezone=Asia/Seoul, 로캘 C.UTF-8)이라 DB 배치가 그대로 돈다.
#   확장은 관리자 앱이 뜰 때 만든다(DB_USERNAME 이 슈퍼유저). 운영 확인 항목:
#     select datcollate, datctype from pg_database where datname = current_database();   -- C.UTF-8
#     select cardinality(show_trgm('한글')) > 0;   -- true 여야 한다(한글 검색 색인)
#     select jobname, schedule, active from cron.job order by 1;   -- DB 배치가 등록됐는지
#   자세히: docs/features/batch-contract.md 「DB 배치」
#
# 서버에서:
#   cp .env.example .env      # 값을 채운다 (.env 는 저장소에 넣지 않는다)
#   docker compose up -d
#
# 서버 2대가 같은 DB 를 쓰므로 서버 간 정합이 필요한 상태는 DB 로 공유한다.
# DB 비밀번호는 DB_PASSWORD=ENC(...) 암호문으로 받고 기동 때 ROBOYAM_CRYPTO_KEY 로 복호화한다 — 두 서버가 같은 키를 써야 한다.
#
# ⚠ 이 파일은 실제 서버에서 아직 시험하지 않았다(문법만 확인).
# ============================================================================

name: roboyam-prod

services:
  app:
    image: ${ROBOYAM_IMAGE}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      # 암호문 ENC(...) — 복호화 키와 한 쌍이다
      DB_PASSWORD: ${DB_PASSWORD}
      ROBOYAM_CRYPTO_KEY: ${ROBOYAM_CRYPTO_KEY}
      # 개인정보 칸 암호화 키·교체 중의 예전 키·중복 확인 해시 키 — 모든 앱 서버와 관리자 앱이 같은 값이어야 한다
      ROBOYAM_DATA_KEY: ${ROBOYAM_DATA_KEY:-}
      ROBOYAM_DATA_KEY_PREVIOUS: ${ROBOYAM_DATA_KEY_PREVIOUS:-}
      ROBOYAM_INDEX_KEY: ${ROBOYAM_INDEX_KEY:-}
      # Snowflake ID 서버 번호 — 앱 서버마다 달라야 한다 (한 대는 1, 다른 한 대는 2 처럼)
      NODE_ID: ${NODE_ID}
      # 설치 마법사(/install) 토큰 — 비워 두면 서버가 뜰 때 무작위 토큰을 만들어 로그에 한 번 출력한다. 앱 서버를 여러 대 띄우면 같은 값을 준다
      ROBOYAM_INSTALL_TOKEN: ${ROBOYAM_INSTALL_TOKEN:-}
      # 관리자 앱 주소(http(s)://…) — 관리자 테마 화면 「실제 화면」 iframe 허락(?adminPreview=1 화면에만 frame-ancestors 로 이 origin 을 붙인다). 비우면 「실제 화면」이 뜨지 않는다
      ADMIN_URL: ${ADMIN_URL:-}
      # 서버 2대 x 풀 크기(+ 관리자 앱)가 DB 서버 max_connections(compose.db.yml)보다 작아야 한다
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      PUBLIC_URL: ${PUBLIC_URL:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
      # 올린 이미지 저장소(docs/features/media-storage-contract.md) — r2(prod 기본) | s3(AWS·MinIO) | local. 아래 volumes 의 폴더는 local 일 때만 쓴다
      ROBOYAM_STORAGE_TYPE: ${ROBOYAM_STORAGE_TYPE:-r2}
      ROBOYAM_STORAGE_R2_ACCOUNT_ID: ${ROBOYAM_STORAGE_R2_ACCOUNT_ID:-}
      ROBOYAM_STORAGE_S3_ENDPOINT: ${ROBOYAM_STORAGE_S3_ENDPOINT:-}
      ROBOYAM_STORAGE_S3_REGION: ${ROBOYAM_STORAGE_S3_REGION:-}
      ROBOYAM_STORAGE_S3_BUCKET: ${ROBOYAM_STORAGE_S3_BUCKET:-}
      ROBOYAM_STORAGE_S3_PATH_STYLE: ${ROBOYAM_STORAGE_S3_PATH_STYLE:-false}
      ROBOYAM_STORAGE_S3_PUBLIC_BASE_URL: ${ROBOYAM_STORAGE_S3_PUBLIC_BASE_URL:-}
      ROBOYAM_STORAGE_S3_ACCESS_KEY: ${ROBOYAM_STORAGE_S3_ACCESS_KEY:-}
      ROBOYAM_STORAGE_S3_SECRET_KEY: ${ROBOYAM_STORAGE_S3_SECRET_KEY:-}
    # 올린 이미지(로고·사이트 아이콘·링크 미리보기 이미지) 저장 폴더. 관리자 앱(compose.admin.yml)과 앱 서버 2대가 같은 파일을 봐야 하므로 MEDIA_DIR 에
    # 공유 디스크(NFS·EFS)의 경로를 준다 — ROBOYAM_STORAGE_TYPE=local 일 때만 쓴다(기본 r2 는 버킷). 비우면 이 서버에만 있는 도커 볼륨이라 서버 한 대 구성에서만 쓸 수 있다
    volumes:
      - ${MEDIA_DIR:-roboyam-media}:/var/lib/roboyam/media
    # 배포 때 ALB 가 이 서버를 빼는 동안 진행 중인 요청을 마무리한다
    stop_grace_period: 40s

volumes:
  roboyam-media:
