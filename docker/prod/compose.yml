# ============================================================================
# ROBOYAM 운영 — 앱 서버 한 대분 (운영은 이 구성을 앱 서버 2대에 각각 올린다)
# ============================================================================
#
# 운영 구성: ALB(HTTPS, ACM 인증서) → 앱 서버 2대(EC2) → RDS PostgreSQL 1대
#   - DB 는 RDS 라 compose 에 넣지 않는다
#   - HTTPS 는 ALB 가 받는다. 앱은 8080 으로 HTTP 만 받는다 (Caddy 없음)
#   - ALB 대상 그룹의 헬스체크 경로: /actuator/health/readiness
#   - /actuator/* 는 로드밸런서 헬스체크용으로만 연다 — 인터넷 쪽(ALB 리스너 규칙·보안 그룹)에서는 /actuator/* 를 막는다
#
# ⚠ RDS 의 DB 로캘: RDS 는 DB 를 만들 때 로캘이 정해진다(나중에 못 바꾼다). LC_CTYPE 이 C.UTF-8(또는 en_US.UTF-8 같은 UTF-8 로캘)이 아니라 `C` 이면
#   pg_trgm 이 한글을 색인하지 못해 한글 검색이 색인을 못 타고 전체를 읽는다. 운영 확인 항목:
#     select datcollate, datctype from pg_database where datname = current_database();
#     select cardinality(show_trgm('한글')) > 0;   -- true 여야 한다
#
# DB 배치(저장 프로시저 + pg_cron — 감사 로그·토큰·로그 정리 등)를 쓰려면 RDS 쪽 준비가 필요하다(없어도 앱은 뜨고 DB 배치만 관리자 화면에 「사용 불가」로 보인다):
#   - 파라미터 그룹: shared_preload_libraries 에 pg_cron 추가(재부팅), cron.database_name = roboyam
#   - 마스터 계정이 roboyam DB 에서 CREATE EXTENSION pg_cron; 앱 계정이 마스터가 아니면 GRANT USAGE ON SCHEMA cron TO <앱 계정>;
#   - RDS 의 pg_cron 은 GMT 로 돈다 — 기본 cron 은 한국시간 기준 값을 서버가 GMT 로 환산해 등록한다
#   자세히: docs/features/batch-contract.md 「DB 배치」
#
# 서버에서:
#   cp .env.example .env      # 값을 채운다 (.env 는 저장소에 넣지 않는다)
#   docker compose up -d
#
# 서버 2대가 같은 DB 를 쓰므로 서버 간 정합이 필요한 상태는 DB 로 공유한다.
# DB 비밀번호는 DB_PASSWORD=ENC(...) 암호문으로 받고 기동 때 ROBOYAM_CRYPTO_KEY 로 복호화한다 — 두 서버가 같은 키를 써야 한다.
#
# ⚠ 이 파일은 실제 서버에서 아직 시험하지 않았다(문법만 확인).
# ============================================================================

name: roboyam-prod

services:
  app:
    image: ${ROBOYAM_IMAGE}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      # 암호문 ENC(...) — 복호화 키와 한 쌍이다
      DB_PASSWORD: ${DB_PASSWORD}
      ROBOYAM_CRYPTO_KEY: ${ROBOYAM_CRYPTO_KEY}
      # Snowflake ID 서버 번호 — 앱 서버마다 달라야 한다 (한 대는 1, 다른 한 대는 2 처럼)
      NODE_ID: ${NODE_ID}
      # 설치 마법사(/install) 토큰 — 비워 두면 서버가 뜰 때 무작위 토큰을 만들어 로그에 한 번 출력한다. 앱 서버를 여러 대 띄우면 같은 값을 준다
      ROBOYAM_INSTALL_TOKEN: ${ROBOYAM_INSTALL_TOKEN:-}
      # 관리자 앱 주소(공개 사이트의 "관리자 앱" 링크). 비우면 링크가 보이지 않는다
      ADMIN_URL: ${ADMIN_URL:-}
      # 서버 2대 x 풀 크기가 RDS 최대 연결 수보다 작아야 한다
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      PUBLIC_URL: ${PUBLIC_URL:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
    # 올린 이미지(로고·사이트 아이콘·링크 미리보기 이미지) 저장 폴더. 관리자 앱(compose.admin.yml)과 앱 서버 2대가 같은 파일을 봐야 하므로 MEDIA_DIR 에
    # 공유 디스크(NFS·EFS)의 경로를 준다. 비우면 이 서버에만 있는 도커 볼륨이라 서버 한 대 구성에서만 쓸 수 있다(S3 저장소는 후속)
    volumes:
      - ${MEDIA_DIR:-roboyam-media}:/var/lib/roboyam/media
    # 배포 때 ALB 가 이 서버를 빼는 동안 진행 중인 요청을 마무리한다
    stop_grace_period: 40s

volumes:
  roboyam-media:
