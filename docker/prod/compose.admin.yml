# ============================================================================
# ROBOYAM 운영 — 관리자 앱 (공개 사이트 앱 서버와 별개의 compose)
# ============================================================================
#
# 관리자 앱은 공개 사이트 앱과 다른 프로세스·다른 도메인이다. 앱 서버 한 대 안에 같이 올려도 되고(포트만 다르게),
# 작은 서버 한 대를 따로 두어도 된다 — 관리 콘솔은 트래픽이 작아 한 대면 충분하다.
#
# 접속 경로: ALB 리스너 규칙(호스트가 ADMIN 도메인) → 이 서버의 8081 포트.
#   - ALB 대상 그룹을 따로 만든다(공개 사이트 대상 그룹과 분리). 헬스체크 경로: /actuator/health/readiness
#   - /actuator/* 는 로드밸런서 헬스체크용으로만 연다(인터넷 쪽에서는 막는다)
#   - 접속 제한(회사 IP 만, WAF 등)은 이 규칙·보안 그룹에서 건다
#
# 서버에서:
#   cp .env.example .env      # 공개 사이트 앱 서버와 같은 .env 를 쓰고 ROBOYAM_ADMIN_IMAGE 만 더한다
#   docker compose -f compose.admin.yml up -d
#
# DB 비밀번호·암호화 키는 공개 사이트 앱 서버와 같은 값이어야 한다.
# ⚠ 이 파일은 실제 서버에서 아직 시험하지 않았다(문법만 확인).
# ============================================================================

name: roboyam-prod-admin

services:
  admin:
    image: ${ROBOYAM_ADMIN_IMAGE}
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ROBOYAM_CRYPTO_KEY: ${ROBOYAM_CRYPTO_KEY}
      # Snowflake ID 서버 번호 — 공개 사이트 앱 서버 2대(NODE_ID)와 모두 달라야 한다 (예: 앱 1·2, 관리자 앱 3)
      NODE_ID: ${ADMIN_NODE_ID}
      # 공개 사이트 앱 서버 2대와 합친 풀 크기가 RDS 최대 연결 수보다 작아야 한다. 관리 콘솔은 작게 잡는다
      DB_POOL_SIZE: ${ADMIN_DB_POOL_SIZE:-5}
      PUBLIC_URL: ${PUBLIC_URL:-}
      JAVA_OPTS: ${ADMIN_JAVA_OPTS:--XX:MaxRAMPercentage=60}
    stop_grace_period: 40s
