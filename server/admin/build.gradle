plugins {
    id 'roboyam.spring-app-conventions'
}

// 관리자 앱 서버. 공개 사이트 서버(server/api)와 서로 의존하지 않는다 — 둘이 같이 쓰는 것은 server/shared 에 둔다.
// 이 모듈의 코드가 직접 import 하는 라이브러리만 선언한다(그 밖의 실행 때 필요한 것은 shared 에서 따라온다).
dependencies {
    implementation project(':server:shared')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 운영자 로그인: AdminAuthController·AdminSession 이 Authentication·보안 컨텍스트 저장소를 쓰고, AdminLoginService·OperatorService 가
    // PasswordEncoder(bcrypt, shared 의 PasswordEncoderConfig 가 만든 빈)를 쓴다
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 스키마 이관(Flyway). 마이그레이션 파일은 shared(db/migration/shared)와 이 앱의 자기 스트림(db/migration/admin)에 있다
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // 운영자 로그인 세션을 DB(admin 스트림 V1 의 admin_spring_session 표 — 공개 사이트의 spring_session 과 분리)에 둔다. AdminSession 이 CookieSerializer(spring-session-core)를 쓰고, 세션 저장소를 DB 로 바꾸는 런타임 구성이기도 하다.
    // 쿠키 이름은 공개 사이트의 SESSION 과 분리된 ADMIN_SESSION 이다
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'

    // 사이트 아이콘의 SVG 소스를 크기별 PNG 로 그린다(SvgRasterizer). 순수 Java2D·의존 라이브러리 없음·MIT. 외부 자원 읽기는 끄고 쓴다. 공개 사이트(api)는 쓰지 않는다
    implementation "com.github.weisj:jsvg:${jsvgVersion}"

    // 커머스 테스트 전용 실제 PostgreSQL 시험 DB(shared 의 testFixtures — CommerceTestDatabase, docs/domain/commerce.md 18절: Testcontainers 는 커머스 테스트에만).
    // 0-2 배치 보강의 시험(roboyam.batch.enabled 스위치 — 요청 집기·예약 실행)이 쓴다
    testImplementation testFixtures(project(':server:shared'))
}
