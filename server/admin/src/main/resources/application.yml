# 관리자 앱 서버(admin-web 용). 두 앱이 같이 쓰는 값은 server/shared 의 roboyam-shared.yml 에 있다.
# 접속 정보·환경 변수는 공개 사이트와 같은 이름(DB_URL … ROBOYAM_CRYPTO_KEY)이다.
spring:
  application:
    name: roboyam-admin
  profiles:
    default: local
  config:
    import: classpath:roboyam-shared.yml

  # 운영자 로그인 세션은 DB(Spring Session JDBC)에 두되 공개 사이트와 다른 표(admin 스트림 V1 의 admin_spring_session)를 쓴다 — 표는 마이그레이션이 만들고 Spring 은 만들지 않는다.
  # timeout 은 비활동 기한(마지막 활동 뒤 2시간)이다 — 로그인 때 AdminSession 이 세션마다 같은 값을 명시한다. 최대 12시간은 AdminSession 이 따로 센다.
  session:
    jdbc:
      initialize-schema: never
      table-name: admin_spring_session
    timeout: ${roboyam.admin-auth.session-idle-timeout}

server:
  port: ${SERVER_PORT:8920}
  servlet:
    session:
      cookie:
        # 공개 사이트의 SESSION 과 이름을 갈라 같은 호스트(포트만 다른)에서도 서로의 세션을 읽지 않는다. 기한(max-age)이 없는 브라우저 세션 쿠키다
        name: ADMIN_SESSION

roboyam:
  schema:
    # 자기 스트림(db/migration/admin). shared 이관은 api 와 어느 쪽이 먼저 떠도 된다 — Flyway 가 DB 잠금으로 한 쪽만 적용한다
    stream: admin
  # 우리가 운영해 믿는 프록시(Caddy) 단 수 — 감사 기록의 요청자 IP 를 고른다(ClientIpResolver). 프록시 없이 앱을 바로 열어 두는 구성이면 0
  proxy:
    trusted-hops: 1
  # 관리자 앱 로그인 (docs/features/roles-contract.md 가정, docs/domain/operator-permissions.md 추가 확정)
  admin-auth:
    login-max-failures: 5         # 같은 이메일로 연속으로 틀릴 수 있는 횟수(이 횟수째 틀리면 잠근다 — 5번째 응답까지는 401, 그 뒤가 429)
    login-lock-seconds: 600       # 잠그는 시간(10분, 지나면 자동 해제)
    session-idle-timeout: 2h      # 세션 비활동 기한(마지막 활동 뒤)
    session-max-age: 12h          # 세션 최대 길이(활동해도 로그인한 지 이만큼 지나면 끝난다)
    invitation-valid-hours: 72    # 운영자 초대 링크의 유효 시간
  # 관리자 앱 주소(환경 변수 ADMIN_URL, http(s)://…) — 초대 메일의 링크 기준. 비어 있으면 초대 메일을 보내지 못하고 로그만 남긴다
  admin-url: ${ADMIN_URL:}

  # 이미지 처리 보호 한도(사이트 로고·아이콘·링크 미리보기 이미지 올리기). 저장소 위치는 공유 설정 roboyam.storage
  media:
    max-concurrent-processing: 2  # 동시에 디코딩·변환할 이미지 수(디코딩한 그림은 메모리를 많이 쓴다). 모자라면 기다리다 10초가 지나면 503 IMAGE_BUSY
    acquire-timeout-seconds: 10
    orphan-retention-hours: 24    # 올리기만 하고 지정하지 않은 파일을 지우기까지 두는 시간

  # 배치 스케줄러 (docs/features/roles-contract.md 「배치 인프라 결과」 가정). 배치 정의는 코드(BatchCatalog), 사용 여부·cron 은 DB(batch_jobs)가 원천이다
  batch:
    scheduler-enabled: true       # 이 서버가 예약 실행을 하는가(false 면 「지금 실행」만 된다)
    zone: Asia/Seoul              # cron 을 해석하는 시간대
    refresh-seconds: 30           # 다른 서버가 바꾼 사용 여부·cron 을 따라오는 주기
    min-interval-seconds: 60      # cron 으로 정할 수 있는 실행 간격의 하한
    log-retention-days: 90        # 배치 실행 로그 보관 일수(「배치 로그 정리」 배치가 지운다)
    pool-size: 4                  # 예약 실행 스레드 수
