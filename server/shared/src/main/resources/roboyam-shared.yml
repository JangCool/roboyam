# 공개 사이트(server/api)와 관리자 앱(server/admin)이 같이 쓰는 설정 — 환경에 상관없는 기본값
#
# 두 앱의 application.yml 이 `spring.config.import: classpath:roboyam-shared.yml` 로 이 파일을 가져온다.
#   - 환경(local · dev · prod)은 빌드가 아니라 실행 때 고른다: SPRING_PROFILES_ACTIVE=dev (지정하지 않으면 local, 기본값은 각 앱의 application.yml)
#   - 환경마다 다른 값은 roboyam-shared-<환경>.yml(이 파일의 프로파일 변형)과 환경 변수가 정한다
#   - 여기에는 환경에 상관없는 값과, 환경 변수로 받을 자리(기본값 없음)만 둔다
#   - dev · prod 는 접속 정보에 기본값이 없다. 환경 변수가 빠지면 기동이 실패한다(빠뜨린 채 뜨지 않게)
#   - 비밀값은 저장소에 넣지 않는다. 환경 변수 목록은 docker/<환경>/.env.example
# 같은 키는 한 곳에서만 정한다 — 한 앱만 읽는 값은 그 앱의 application.yml 에 둔다.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    # dev · prod 는 평문이 아니라 암호문 ENC(...) 를 넣는다. 기동 때 ROBOYAM_CRYPTO_KEY 로 복호화한다(EncryptedPropertyPostProcessor)
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  # 스키마는 Flyway 마이그레이션(db/migration/<스트림>)이 만든다. Hibernate 가 만들지 않는다
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # 위치·이력 표(shared 스트림)와 자기 스트림 이관은 코드가 정한다(SchemaMigrationConfig) — 여기에 spring.flyway.locations 를 두지 않는다.
  # 끄면(false) shared·자기 스트림 모두 이관되지 않는다(자동 구성이 이관 전략을 부르므로).
  flyway:
    enabled: true

  # 서버가 응답에 싣는 문구(오류 message·입력 오류 fields·설치 점검·인증 메일)의 번들. 언어는 요청의 Accept-Language(ko|en, 기본 ko)로 정한다.
  # 번들 위치·인코딩은 이 값을 따른다(MessageConfig). 키가 없는 언어는 ko 로 되돌아간다.
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # 인증 메일 서버는 설치 마법사·설정 화면이 DB(mail_settings)에 저장한다. 여기에 spring.mail.* 기본값을 두지 않는다.

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 파일 올리기(multipart) 한도. 이미지 규칙(2MB)은 서비스가 판정하고 "지금 몇 MB" 를 문구로 알려야 하므로 그 위(10MB)까지는 받아 서비스가 거절한다. 그 위는 413 FILE_TOO_LARGE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  shutdown: graceful
  # Caddy 뒤에서 도므로 X-Forwarded-* 를 따른다(원래 주소·https 여부 — 세션·CSRF 쿠키의 Secure 판단)
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

# 로그 줄마다 요청 ID(MDC requestId — RequestIdFilter)를 싣는다. 요청 밖의 로그는 빈 칸이다
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# 도커·설치기는 앱을 /actuator/health/readiness 로 기다린다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

roboyam:
  # 올린 이미지(로고·사이트 아이콘·링크 미리보기 이미지)의 저장소. 로컬 디스크 폴더를 공개 사이트(api)와 관리자 앱(admin)이 같이 본다 — admin 이 쓰고 둘 다 /media/** 로 읽는다.
  # 도커·설치형은 같은 볼륨을 두 앱의 이 경로에 마운트한다(docker/*, installer/). 서버가 여러 대이면 공유 디스크(NFS·EFS)나 S3(후속)가 필요하다
  storage:
    type: local
    local-path: ${ROBOYAM_STORAGE_PATH:/var/lib/roboyam/media}
  # Snowflake ID 의 서버 번호(0~1023). 앱 서버마다 달라야 한다(공개 사이트·관리자 앱·서버 여러 대 모두 서로 다른 값). dev · prod 는 기본값이 없다 — 빠지면 기동이 실패한다
  node-id: ${NODE_ID}
  # 개인정보 칸 암호화(DataCipher)·중복 확인 해시(BlindIndex) — 설정 비밀값용 ROBOYAM_CRYPTO_KEY 와 따로다(docs/domain/commerce.md 10-9).
  # 비어 있어도 앱은 뜨고 그 키가 필요한 요청만 503 이다. local 만 개발용 기본값이 있다(roboyam-shared-local.yml)
  data-crypto:
    key: ${ROBOYAM_DATA_KEY:}                     # 지금 키 「<버전>:<base64 32바이트>」 — 잃으면 저장된 값을 영영 못 읽는다(백업)
    previous-keys: ${ROBOYAM_DATA_KEY_PREVIOUS:}  # 키 교체 중의 예전 키(쉼표로 여럿, 풀기만 한다). 교체 배치가 끝나면 비운다
    index-key: ${ROBOYAM_INDEX_KEY:}              # 해시 키 base64 32바이트 — 바꿀 수 없다(원문을 남기지 않아 다시 계산할 수 없다)
  # 메일 서버 연결 시험의 시간 제한(설치 마법사 mail-check)
  mail:
    connect-timeout-millis: 5000
    io-timeout-millis: 10000
  # 설치 마법사(docs/features/install-contract.md). 서버를 처음 띄우면 설치 전이고 /install 에서 설치를 마쳐야 쓸 수 있다
  install:
    # 설치 토큰. 비우면 설치 전 기동 때 서버가 무작위 토큰(24자)을 만들어 로그에 한 번만 출력한다. 자동화·컨테이너·서버 여러 대는 환경 변수로 같은 토큰을 준다.
    # local 만 개발용 기본값이 있다(roboyam-shared-local.yml) — dev · prod 에는 기본값이 없다
    token: ${ROBOYAM_INSTALL_TOKEN:}
    max-failures: 5               # 같은 IP 가 연속으로 틀릴 수 있는 횟수(이 횟수째 틀리면 잠근다)
    lock-seconds: 600             # 잠그는 시간(10분)
    global-per-minute: 30         # 서버 전체에서 분당 받는 토큰 확인 시도 상한
    refresh-millis: 15000         # 설치 전에 다른 앱 서버가 끝낸 설치를 따라오는 주기(설치가 끝나면 멈춘다)
  # 본인인증(docs/features/commerce-foundation-contract.md 「0-4」). 구현은 배포 설정이다 — portone(포트원 통합 본인인증) | fake(local·시험 전용).
  # dev · prod 프로필에서 fake 면 기동을 멈춘다(IdentityConfig). 포트원 상점 ID·API 비밀키·채널 키는 관리자 화면(설정 › 포트원)이 DB 에 암호화해 둔다. local 은 fake(roboyam-shared-local.yml)
  identity:
    provider: ${ROBOYAM_IDENTITY_PROVIDER:portone}
    verification-ttl: 30m        # 서버가 발급한 인증 번호의 유효 시간 — 지나면 확정할 수 없다(410)
  # 소모임(docs/features/group-contract.md — GroupProperties). 아래는 관리자 앱 소모임 설정에 저장된 값이 없을 때의 기본값이다(저장된 값이 이긴다 — DB > yml).
  # 화면에 없는 한도: 하루 개설 신청 수 · 하루 가입·신청 수 · 상세 「최근 N일 가입」. 그 밖의 칸(매니저·공개 범위·지금 뜨는·일정 한도)은 GroupProperties 의 기본값을 쓴다
  groups:
    creation-mode: APPROVAL      # 개설 방식 APPROVAL(승인제) | OPEN(자유 개설)
    min-grade: REGULAR           # 개설 최소 등급 키(등급 설정에 없으면 누구나)
    max-per-owner: 3             # 한 사람이 모임장일 수 있는 소모임 수(신청 중·열림·비활성 합)
    dissolve-penalty-days: 30    # 해산한 모임장이 새 소모임을 개설 신청할 수 없는 일수(0 = 끔, 개설부터 1년 이상 유지된 소모임은 면제)
    reapply-days: 7              # 가입 거절 뒤 재신청 대기 일수
    capacity-min: 5
    capacity-max: 200
    create-daily-limit: 1        # 24시간 개설 신청 수(0 = 제한 없음)
    join-daily-limit: 50         # 24시간 가입·신청 수 합(0 = 제한 없음)
  # 결제 모듈(docs/features/commerce-payment-contract.md). 게이트웨이는 배포 설정이다 — portone(포트원 V2) | fake(local·시험 전용). dev · prod 프로필에서 fake 면 기동을 멈춘다(PaymentConfig).
  # 포트원 상점 ID·API 비밀키·결제 채널 키·웹훅 비밀키는 관리자 화면(설정 › 포트원)이 DB 에 암호화해 둔다. 운영 값(READY 여유 시간·웹훅 기록 보관)은 batch_params 다
  payment:
    gateway: ${ROBOYAM_PAYMENT_GATEWAY:portone}
    test-orders: ${ROBOYAM_PAYMENT_TEST_ORDERS:false}  # 결제 시험 주문(PAYMENT_TEST · /api/dev/payments) — local · dev 만. prod 에서 켜면 기동을 멈춘다
    cancel-batch-size: 20        # 취소 워커가 한 바퀴(1분)에 집는 취소 수 — PG 호출 속도 제한
    cancel-gap: 200ms            # 취소 사이 간격
    cancel-max-retries: 5        # 즉시 시도 뒤 재시도 횟수 — 다 쓰면 GAVE_UP(결제 이상 목록·운영자 알림)
    cancel-backoff: 1m,5m,30m,120m,720m  # n 번째 재시도까지의 간격
    cancel-stale: 10m            # SENDING 으로 이만큼 머문 취소는 보내던 서버가 죽은 것으로 보고 되돌린다
  # 탈퇴 대비(commerce.md 17-2 · 17-3). 쓰는 탈퇴 기능은 아직 없다 — 기록 장치(IdentityWithdrawalRecorder · WithdrawnContactStore)만 있다
  withdrawal:
    rejoin-block-days: 30        # 같은 이메일·소셜 계정·본인인증 값이 탈퇴 뒤 다시 가입·인증할 수 없는 기간(탈퇴 때 박는다)
    contact-retention-years: 5   # 탈퇴 회원 연락용 이메일을 마지막 거래일부터 보관하는 기간
