mail.host.required=Enter the mail server address.
mail.host.length=The mail server address can be up to {0} characters.
mail.host.blank=The mail server address cannot contain spaces or control characters.
mail.port.required=Enter the port.
mail.port.range=The port must be a number from 1 to 65535.
mail.from.required=Enter the sender email.
mail.from.format=The sender email format is not valid.
mail.security.invalid=Connection security must be one of NONE, STARTTLS, or SSL.
mail.username.length=The username can be up to {0} characters.
mail.username.control=The username cannot contain control characters.
mail.username.required=Enter a username too if you entered a password.
mail.password.length=The password can be up to {0} characters.
mail.password.control=The password cannot contain control characters.
mail.password.required=Enter a password to use authentication.

