# Human-readable text the server puts in its responses - English.
# Korean is messages_ko.properties (the default language; a missing key here falls back to it).
# Both files must have the same keys (a mismatch is logged as a warning at startup in the local and dev profiles).
# Keys are `area.what`. {0} and {1} are argument slots - do not use a single quote (') in a message that takes arguments (MessageFormat quoting).
# See .claude/guides/backend/exception.md 2-2.

# -- Error response message (error.<error code>) --
error.VALIDATION=Check the values you entered.
error.MALFORMED_REQUEST=The request body could not be read.
error.INVALID_PARAMETER=The request value could not be read.
error.INVALID_PARAMETER.named=Could not read the value of "{0}".
error.UNAUTHENTICATED=You need to log in.
error.FORBIDDEN=You do not have permission.
error.CSRF_INVALID=The request could not be verified. Refresh the page and try again.
error.NOT_FOUND=Address not found.
error.METHOD_NOT_ALLOWED=This method is not allowed for this address.
error.FILE_TOO_LARGE=The file is larger than the server accepts. Upload a smaller file.
error.CRYPTO_KEY_MISSING=The encryption key is not configured, so this cannot be saved. Register ROBOYAM_CRYPTO_KEY on the server.
error.DATABASE_UNAVAILABLE=Cannot connect to the database.
error.INTERNAL=A server error occurred.
error.NOT_INSTALLED=Installation is not finished yet. Complete it on the install page (/install).
error.EMAIL_TAKEN=This email is already registered.
error.NICKNAME_TAKEN=This nickname is already taken. Enter a different one.
error.ALREADY_VERIFIED=This email is already verified.
error.INVALID_CREDENTIALS=The email or password is incorrect.
error.LOGIN_LOCKED=Too many failed log-in attempts. Try again in a little while.
error.RESEND_COOLDOWN=You can resend this in a little while.
error.ALREADY_INSTALLED=Installation is already finished.
error.INSTALL_AUTH_REQUIRED=Verify the install token first.
error.INSTALL_TOKEN_INVALID=The install token is incorrect.
error.INSTALL_TOKEN_LOCKED=Too many incorrect install token attempts. Try again in a little while.

