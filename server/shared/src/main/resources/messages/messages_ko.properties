# 서버가 응답에 싣는 사람이 읽는 문구 — 한국어(기본 언어, 키가 없는 언어는 여기로 되돌아온다).
# 영어는 messages_en.properties. 두 파일의 키는 같아야 한다(local·dev 기동 때 다르면 경고한다).
# 키는 `업무.무엇`. {0}·{1} 은 인자 자리다 — 인자가 있는 문구에서는 작은따옴표(')를 쓰지 않는다(MessageFormat 의 인용 문자).
# 설명은 .claude/guides/backend/exception.md 2-2.

# ── 오류 응답의 message (error.<오류 코드>) ──
error.VALIDATION=입력값을 확인하세요.
error.MALFORMED_REQUEST=요청 본문을 읽을 수 없습니다.
error.INVALID_PARAMETER=요청 값을 읽을 수 없습니다.
error.INVALID_PARAMETER.named=「{0}」 값을 읽을 수 없습니다.
error.UNAUTHENTICATED=로그인이 필요합니다.
error.FORBIDDEN=권한이 없습니다.
error.CSRF_INVALID=요청을 확인할 수 없습니다. 페이지를 새로 고친 뒤 다시 시도하세요.
error.NOT_FOUND=없는 주소입니다.
error.METHOD_NOT_ALLOWED=이 주소에서는 쓸 수 없는 방식입니다.
error.FILE_TOO_LARGE=파일이 서버가 받을 수 있는 크기를 넘었습니다. 더 작은 파일로 올리세요.
error.CRYPTO_KEY_MISSING=암호화 키가 설정돼 있지 않아 저장할 수 없습니다. 서버에 ROBOYAM_CRYPTO_KEY 를 등록하세요.
error.DATA_KEY_MISSING=개인정보 암호화 키가 설정돼 있지 않아 지금은 처리할 수 없어요. 잠시 뒤에 다시 시도해 주세요.
error.INDEX_KEY_MISSING=확인용 키가 설정돼 있지 않아 지금은 처리할 수 없어요. 잠시 뒤에 다시 시도해 주세요.
error.DATABASE_UNAVAILABLE=데이터베이스에 접속할 수 없습니다.
error.INTERNAL=서버에서 오류가 발생했습니다.
error.NOT_INSTALLED=아직 설치가 끝나지 않았어요. 설치 화면(/install)에서 설치를 마쳐 주세요.
error.EMAIL_TAKEN=이미 가입된 이메일이에요.
error.NICKNAME_TAKEN=이미 쓰고 있는 닉네임이에요. 다른 닉네임을 입력해 주세요.
error.ALREADY_VERIFIED=이미 인증된 이메일이에요.
error.INVALID_CREDENTIALS=이메일 또는 비밀번호가 올바르지 않아요.
error.LOGIN_LOCKED=로그인을 여러 번 실패해 잠시 잠겼어요. 잠시 뒤에 다시 시도해 주세요.
error.RESEND_COOLDOWN=잠시 뒤에 다시 보낼 수 있어요.
error.ALREADY_INSTALLED=이미 설치가 끝났어요.
error.INSTALL_AUTH_REQUIRED=설치 토큰을 먼저 확인해 주세요.
error.INSTALL_TOKEN_INVALID=설치 토큰이 맞지 않아요.
error.INSTALL_TOKEN_LOCKED=설치 토큰을 여러 번 틀려 잠시 잠겼어요. 잠시 뒤에 다시 시도해 주세요.
error.TOKEN_INVALID=링크가 올바르지 않거나 이미 사용됐어요.
error.TOKEN_EXPIRED=링크가 만료됐어요. 새 링크를 받아 주세요.
error.SAME_PASSWORD=지금 쓰는 비밀번호와 같아요. 다른 비밀번호를 입력해 주세요.
error.CURRENT_PASSWORD_WRONG=현재 비밀번호가 맞지 않아요.
error.PASSWORD_NOT_SET=소셜 로그인으로 가입한 계정은 비밀번호가 없어요.
