# 공개 사이트 서버(user-web 용). 두 앱이 같이 쓰는 값은 server/shared 의 roboyam-shared.yml 에 있다.
spring:
  application:
    name: roboyam-api
  profiles:
    default: local
  config:
    import: classpath:roboyam-shared.yml

  # 설치 인증 세션과 로그인 세션은 DB(Spring Session JDBC, V2 의 spring_session 표)에 둔다. 표는 마이그레이션이 만들고 Spring 은 만들지 않는다.
  # timeout 은 세션 기본 기한이다 = 로그인 세션의 "마지막 활동 뒤 30일"(roboyam.auth.session-timeout). 설치 인증 세션은 InstallSession 이 세션마다 1800초(30분)로
  # 따로 정하므로 이 기본값과 섞이지 않는다(세션별 값이 이긴다). 로그인 세션도 LoginSession 이 같은 값을 세션마다 명시한다.
  session:
    jdbc:
      initialize-schema: never
    timeout: ${roboyam.auth.session-timeout}

server:
  port: ${SERVER_PORT:8910}
  servlet:
    session:
      cookie:
        name: SESSION
        # 브라우저를 닫아도 로그인이 유지되게 쿠키에 기한을 둔다. 앱을 열 때마다 GET /api/auth/me 가 쿠키를 다시 써서 기한을 오늘부터로 늘린다(AuthController)
        max-age: ${roboyam.auth.session-timeout}

roboyam:
  schema:
    # 자기 스트림(db/migration/api). 이 값이 있어야 자기 스트림이 이관된다 — shared 는 늘 먼저 이관된다
    stream: api
  # 우리가 운영해 믿는 프록시(Caddy). 요청자 IP 는 X-Forwarded-For 의 뒤에서 trusted-hops 번째 값을 쓴다 — 앞쪽 값은 요청자가 꾸밀 수 있어 쓰지 않는다.
  # 설치 토큰 IP 잠금이 쓴다(ClientIpResolver). 프록시 없이 앱을 바로 열어 두는 구성이면 0 으로 둔다(헤더를 믿지 않고 접속 주소만 쓴다)
  proxy:
    trusted-hops: 1
  # 로그인·인증 (docs/features/login-contract.md)
  auth:
    login-max-failures: 5         # 같은 이메일로 연속으로 틀릴 수 있는 횟수(이 횟수째 틀리면 잠근다 — 5번째 응답까지는 401, 그 뒤가 429)
    login-lock-seconds: 600       # 잠그는 시간(10분)
    verify-token-hours: 24        # 이메일 인증 링크의 유효 시간
    resend-cooldown-seconds: 60   # 인증 메일 재발송 간격(가장 최근에 보낸 링크 기준)
    session-timeout: 30d          # 로그인 세션: 마지막 활동 뒤 이 기간. spring.session.timeout 과 세션 쿠키 기한이 이 값을 따른다
  # 회원 계정 흐름(docs/features/member-account-contract.md) — 재발송 60초·로그인 잠금은 위 auth 값을 함께 쓴다
  account:
    reset-token-minutes: 60       # 비밀번호 재설정 링크의 유효 시간(분)
    email-change-token-hours: 24  # 이메일 변경 링크의 유효 시간
  # 소셜 로그인(카카오·네이버·구글, OAuth 2.0 인가 코드 흐름 — docs/features/login-contract.md 「소셜 로그인」). 공급자 주소는 코드에 고정이다(SocialEndpoints).
  # 공급자 콘솔에 등록할 콜백 주소: {사이트 공개 주소}/api/auth/social/{kakao|naver|google}/callback
  social:
    state-ttl: 10m              # 시작한 흐름(state·PKCE·nonce)의 유효 시간 — 이 안에 공급자에서 돌아와야 한다
    pending-ttl: 15m            # 처음 보는 소셜 계정의 가입 완료 대기 유효 시간(서버 세션)
    rate-window: 10m            # IP 기준 요청 한도를 세는 창
    start-per-window: 30        # 한 IP 가 창 안에 소셜 로그인·연결을 시작할 수 있는 횟수
    complete-per-window: 10     # 한 IP 가 창 안에 가입 완료를 요청할 수 있는 횟수
    connect-timeout: 3s         # 공급자 접속 제한 시간
    read-timeout: 5s            # 공급자 응답 제한 시간
    # 시험용 가짜 공급자 — local 프로필 + 루프백 주소일 때만 쓰인다(dev·prod 에서는 켜도 무시하고 경고만 남긴다). 기본 꺼짐
    test-endpoints:
      enabled: ${ROBOYAM_SOCIAL_TEST_ENDPOINTS_ENABLED:false}
      base-url: ${ROBOYAM_SOCIAL_TEST_ENDPOINTS_BASE_URL:}
  # 비회원 글·댓글의 자동입력 방지(docs/features/board-public-contract.md 추가 결정 1). 비밀키가 비어 있으면 검증하지 않고 기동 로그에 경고한다(CaptchaConfig)
  captcha:
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
  # 글 본문 이미지 올리기(POST /api/images — board-public-contract.md 「에디터·이미지」). 저장소 위치는 공유 설정 roboyam.storage(관리자 앱과 같은 폴더)
  post-image:
    max-bytes: 10485760         # 한 장 10MB(multipart 한도와 같다 — 넘으면 413 FILE_TOO_LARGE)
    max-pixels: 25000000        # 가로×세로 최대 화소(디코딩 전에 거절)
    max-side: 2048              # 긴 변이 넘으면 줄인다(JPEG·PNG·한 장 GIF)
    per-minute: 20              # 회원당 1분 올리기 수(이 서버 메모리) — 넘으면 429 IMAGE_RATE_LIMITED
    daily-limit: 300            # 회원당 최근 24시간 올리기 수(DB) — 넘으면 429 IMAGE_DAILY_LIMIT
  # 이미지 처리 보호 한도(코덱·관문은 shared). 안 쓴 이미지 정리(file-orphan-cleanup)는 관리자 앱의 배치다
  media:
    max-concurrent-processing: 2  # 동시에 디코딩·변환할 이미지 수 — 모자라면 기다리다 10초가 지나면 503 IMAGE_BUSY
    acquire-timeout-seconds: 10
