group=com.community
version=0.1.0-SNAPSHOT

# 버전은 community 프로젝트와 같다
javaVersion=25
springBootVersion=4.1.1
springDependencyManagementVersion=1.1.7
querydslVersion=5.1.0

# RoboyamRepository 가 상속하는 hypersistence-utils (save() 의 merge 대신 persist()/update() 제공)
# 아티팩트 갈래가 Hibernate 버전을 따라간다 — -hibernate-74 는 없고 -hibernate-73 이 최신이다.
hypersistenceVersion=3.15.4

# MapStruct (buildSrc/src/main/groovy/roboyam.mapstruct-conventions.gradle)
mapstructVersion=1.6.3

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
