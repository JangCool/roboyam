<script>
    (function () {
        try {
            var theme = 'AUTO';
            try {
                var saved = JSON.parse(localStorage.getItem('irobit:view-settings') || 'null');
                if (saved && (saved.theme === 'DARK' || saved.theme === 'LIGHT')) theme = saved.theme;
            } catch (e) {}
            var mobile = window.matchMedia('(max-width: 767.98px)').matches;
            var dark = theme === 'DARK' || (theme === 'AUTO' && !mobile && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
    })();
</script>
