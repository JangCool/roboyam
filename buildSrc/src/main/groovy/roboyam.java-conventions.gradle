/*
 * roboyam 자바 공통 규약.
 *
 * 모든 자바 모듈이 확실히 필요로 하는 것만 둔다.
 */

plugins {
    // java-library — 모듈 간 의존에서 api / implementation 을 구분한다
    id 'java-library'
}

group   = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('javaVersion').get() as int)
    }
}

// 디렉토리명은 접두어 없이, 산출물 이름은 접두어를 붙인다
base {
    archivesName = "roboyam-${project.name}"
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // 시험 JVM 도 앱과 같이 UTC 로 돈다 — 호스트(개발 PC)의 시간대에 기대지 않는다
    systemProperty 'user.timezone', 'UTC'
    // local 포트원 시드(roboyam-shared-local.yml)는 시험에서 끈다 — 앱 시험이 local 프로필로 떠서 시험 DB 의 포트원 설정을 채우지 않게(PortOneLocalSeeder)
    systemProperty 'roboyam.portone.seed.enabled', 'false'
    // 앱 전체 문맥(엔티티 약 250개)을 띄우는 시험이 많다 — Gradle 기본 힙(512MB)으로는 모듈 시험 전체에서 문맥 캐시가 쌓여 OutOfMemoryError 가 난다(2026-11-07 JPA 전환 뒤 admin).
    // 힙을 넉넉히 두고, 스프링 시험 문맥 캐시는 최근 것 몇 개만 남긴다(기본 32 — 넘친 문맥은 닫히고 필요하면 다시 띄운다)
    maxHeapSize = '2g'
    systemProperty 'spring.test.context.cache.maxSize', '8'
}
